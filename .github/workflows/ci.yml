name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"
      - name: Links, indexes and ruleset
        run: python3 tools/check_docs.py

  # Add the other jobs here (android, firmware-host, firmware-sketch, enclosure) and list
  # them in the "needs" of ci-ok. A job must always run: ci-ok treats a skipped job as a
  # failure. To skip work when nothing relevant changed, put the condition on the steps,
  # never on the job or on the workflow.

  ci-ok:
    if: always()
    needs: [docs]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            exit 1
          fi
