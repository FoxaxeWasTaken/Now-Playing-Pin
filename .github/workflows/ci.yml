name: CI

on:
  pull_request:
    branches: [main]
    # "edited" so that fixing a pull request title runs the check again.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every hook of .pre-commit-config.yaml
        run: pipx run pre-commit run --all-files --show-diff-on-failure
      - name: Every Mermaid diagram renders
        run: bash tools/check_mermaid.sh

  # Pull requests are squashed: the title is the commit that lands on main.
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check the commit subject
        env:
          # Passed through the environment, never pasted into the script: a title is
          # untrusted text.
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${PR_TITLE:-$(printf '%s\n' "$HEAD_MESSAGE" | head -n 1)}"
          pattern='^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! "$subject" =~ $pattern ]]; then
            echo "::error::Not a conventional commit, expected 'type(scope): description': $subject"
            exit 1
          fi
          echo "OK: $subject"

  android:
    name: Android (build, tests, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Java 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build, JVM tests and Android Lint
        run: ./gradlew --console=plain assembleDebug testDebugUnitTest lintDebug
      - name: The app does not declare the network permission
        run: |
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)"
          permissions="$("$aapt2" dump permissions app/build/outputs/apk/debug/app-debug.apk)"
          echo "$permissions"
          if grep -q 'android.permission.INTERNET' <<<"$permissions"; then
            echo "::error::The app declares INTERNET, which V1 does not allow (docs/android-app.md)"
            exit 1
          fi

  firmware-sketch:
    name: Firmware (Arduino sketch)
    runs-on: ubuntu-latest
    env:
      BOARDS_URL: https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: 1.5.1
      - name: Install the Seeed nRF52 core, and the tool its build calls
        run: |
          arduino-cli core update-index --additional-urls "$BOARDS_URL"
          arduino-cli core install Seeeduino:nrf52@1.1.13 --additional-urls "$BOARDS_URL"
          pipx install adafruit-nrfutil==0.5.3.post16
      - name: Compile for the XIAO nRF52840 Plus, with the portable code
        run: arduino-cli compile --fqbn Seeeduino:nrf52:xiaonRF52840Plus --library firmware/render firmware/pin

  enclosure:
    name: Enclosure (OpenSCAD models)
    runs-on: ubuntu-24.04 # pinned: its Ubuntu release sets OpenSCAD 2021.01 (docs/adr/0016-*)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version
      - name: Export every model to STL, warnings as errors
        run: |
          mkdir -p build/enclosure
          for model in enclosure/*.scad; do
            openscad --hardwarnings -o "build/enclosure/$(basename "$model" .scad).stl" "$model"
          done

  # A new job goes here and in the "needs" of ci-ok. A job must always run: ci-ok treats a
  # skipped job as a failure. To skip work when nothing relevant changed, put the condition on the steps,
  # never on the job or on the workflow.

  firmware-host:
    name: Firmware (host build and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure, with warnings as errors and the sanitizers
        run: cmake -S firmware -B build/firmware
      - name: Build
        run: cmake --build build/firmware --parallel
      - name: Test
        run: ctest --test-dir build/firmware --output-on-failure

  ci-ok:
    if: always()
    needs: [lint, conventional-commit, firmware-host, firmware-sketch, android, enclosure]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled|skipped'; then
            exit 1
          fi
